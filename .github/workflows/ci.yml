name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-dotenv

      - name: Compile all entry points
        run: |
          python -m compileall -q transcripto_core tests \
            transcripto.py transcripto_gui.py transcripto_batch.py \
            transcripto_recursive.py setup_gpu.py

      - name: Run unit tests
        run: python -m pytest
